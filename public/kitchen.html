<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b4536">
    <title>Kitchen desk · Surplus Window</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/desk.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <div class="wrap bar">
        <a class="brand" href="/"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Surplus Window</a>
        <nav>
          <a href="/">Home</a>
          <button class="link" id="signout">Sign out</button>
        </nav>
      </div>
    </header>
    <main class="wrap desk" id="main" data-role="kitchen">
      <p class="kicker">Windhoek collection network</p>
      <div class="heading">
        <div>
          <h1>Kitchen desk</h1>
          <p id="org">Opening your session…</p>
        </div>
        <div class="clock">
          <small id="clock-label">Collection time</small><strong id="clock">—</strong>
          <small>Africa/Windhoek</small>
        </div>
      </div>
      <div id="feedback" class="feedback" role="status">
      </div>
      <div id="uncertain">
      </div>
      <section>
        <div class="section-head">
          <h2>Pickup windows</h2>
          <small id="count"></small>
        </div>
        <div id="listings">
        </div>
      </section>
      <section>
        <h2>Your reservations</h2>
        <div id="holds">
        </div>
      </section>
    </main>
    <footer>
      <div class="wrap bar"><b>Surplus Window</b>
        <small>Fictional food donation demo · Windhoek, Namibia</small>
      </div>
    </footer>
  </body>
</html>
